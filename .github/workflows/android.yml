name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without a stable key every run signs with a fresh throwaway debug keystore, and
      # Android then refuses to install the new build over the old one. The build still
      # works without the secret - it just cannot produce an installable update.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sigeye.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/sigeye.p12" >> "$GITHUB_ENV"
            echo "Signing with the stable SigEye key."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. Falling back to a"\
                 "throwaway debug key - this APK will NOT install over an existing"\
                 "SigEye, and updates will require an uninstall."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Release rather than debug. A debug APK is debuggable by anything with adb, which
      # is the wrong property for this app to ship with. assembleRelease also runs
      # lintVitalRelease, so fatal issues fail here rather than on somebody's phone.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      # Not continue-on-error any more. It was, and it hid a real NoSuchMethodError on
      # Android 8 for weeks: CellIdentity.mccString is API 28 while minSdk is 26, lint
      # said so on every single run, and nobody reads a step that cannot fail.
      - name: Lint
        run: ./gradlew lintRelease --no-daemon

      # Signed and unsigned land under different names, and quietly publishing the
      # unsigned one would produce a release nobody can install over their existing copy.
      - name: Stage APK
        run: |
          mkdir -p out
          SIGNED=app/build/outputs/apk/release/app-release.apk
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$SIGNED" ]; then
            cp "$SIGNED" out/SigEye.apk
          elif [ -f "$UNSIGNED" ]; then
            echo "::warning::No signing key, staging an unsigned APK. It will not install"\
                 "over an existing SigEye."
            cp "$UNSIGNED" out/SigEye.apk
          else
            echo "::error::assembleRelease produced no APK."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SigEye-apk
          path: out/SigEye.apk
          retention-days: 90

      # One release per build, tagged by run number. /releases/latest still resolves to
      # the newest, so the download URL never changes - but update managers such as
      # Obtainium can now tell one build from the next, which a rolling tag hides.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${GITHUB_RUN_NUMBER}"
          SHA_SHORT="${GITHUB_SHA::7}"
          SUBJECT="$(git log -1 --pretty=%s)"

          NOTES="${SUBJECT}"
          NOTES="${NOTES}"$'\n\n'"Build ${TAG} from ${SHA_SHORT}, version 0.1.${GITHUB_RUN_NUMBER}."
          NOTES="${NOTES}"$'\n'"New to this? What to try first: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RELEASE_NOTES.md"
          if [ -n "$SIGNING_KEYSTORE_PASSWORD" ]; then
            NOTES="${NOTES} Installs over the previous version; settings and CSV logs are kept."
          else
            NOTES="${NOTES} UNSIGNED BUILD - will not install over an existing SigEye."
          fi

          gh release create "$TAG" out/SigEye.apk \
            --title "SigEye $TAG" \
            --notes "$NOTES"

          # Retire the old rolling tag if it is still around; versioned releases replace it.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-release.html
          retention-days: 14
